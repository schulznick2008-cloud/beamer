[package]
name = "beamer-teleport-win"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Windows-Helfer fuer Beamer-Teleport: Empfangen, D3D11VA-Decode, Anzeige (SCHNITTSTELLEN.md 1, 4, 5)"
build = "build.rs"

[[bin]]
name = "beamer-teleport"
path = "src/main.rs"

[dependencies]
beamer-transport = { path = "../transport" }
rusty_ffmpeg = { version = "=0.17.0", features = ["ffmpeg8_1"] }
serde_json = "1"
base64 = "0.22"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
